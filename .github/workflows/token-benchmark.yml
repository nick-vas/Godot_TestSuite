# Measures the tokens, cost and time Claude Code spends on the tasks of a programme under each profile
# (benchmark/Invoke-TokenBenchmark.ps1): `tool`, questions about this kit's own code (benchmark/token-benchmark.json), or
# `game`, work on a small Godot game graded by its tests (benchmark/game-benchmark.json, which installs Godot first). Manual only: each run calls the model. Authenticates with a Claude subscription,
# not an API key: the repository secret CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (the same one the Evals
# workflow uses). Runs count against that plan's usage, meant for ordinary individual use, so keep runs small (one task,
# -Repeat 1) and start them by hand. The cost columns are Claude Code's own figure, not a charge on the plan.
name: Token benchmark

on:
  workflow_dispatch:
    inputs:
      programme:
        description: Which programme to run
        type: choice
        options: [tool, game]
        default: tool
      model:
        description: Model alias or id (empty for the spec's)
        default: ''
      repeat:
        description: Runs per task and profile (empty for the spec's)
        default: ''
      profiles:
        description: Comma-separated profile ids (empty for all)
        default: ''
      tasks:
        description: Comma-separated task ids (empty for all)
        default: ''
      plugin:
        description: Load this repository as a Claude Code plugin (its skills); run once with and once without to compare
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # An ANTHROPIC_API_KEY in the environment would take precedence over the token, so none is set here.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Claude Code
        shell: pwsh
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN) { throw 'Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (from claude setup-token) to run the benchmark' }
          npm install -g @anthropic-ai/claude-code
      # The game programme's sessions run Godot, and its grader runs the game's tests; setup sets GODOT_BIN for both.
      - name: Godot for the game programme
        if: inputs.programme == 'game'
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 setup -Project examples/gdscript
      # One small request first: a token that is malformed or revoked fails here, by name, instead of as a run of 0 scores.
      - name: The subscription token works
        shell: pwsh
        run: |
          $token = $env:CLAUDE_CODE_OAUTH_TOKEN
          if ($token -match '\s') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN contains spaces or line breaks; paste it again as one line' }
          if ($token -notmatch '^sk-ant-oat') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN does not start like a claude setup-token token (sk-ant-oat...)' }
          $out = claude -p 'Reply with the single word OK.' --max-turns 1 --output-format json 2>&1
          if ($LASTEXITCODE) { throw "Claude Code rejected CLAUDE_CODE_OAUTH_TOKEN; run claude setup-token again and replace the secret: $out" }
      - name: Run the benchmark
        shell: pwsh
        env:
          MODEL: ${{ inputs.model }}
          REPEAT: ${{ inputs.repeat }}
          PROFILES: ${{ inputs.profiles }}
          TASKS: ${{ inputs.tasks }}
          PLUGIN: ${{ inputs.plugin }}
          PROGRAMME: ${{ inputs.programme }}
        run: |
          $params = @{ OutputDir = 'benchmark/results'; SaveResponses = $true }
          if ($env:PROGRAMME -eq 'game') { $params.SpecPath = 'benchmark/game-benchmark.json' }
          if ($env:MODEL) { $params.Model = $env:MODEL }
          if ($env:REPEAT) { $params.Repeat = [int]$env:REPEAT }
          if ($env:PROFILES) { $params.ProfileId = $env:PROFILES }
          if ($env:TASKS) { $params.TaskId = $env:TASKS }
          if ($env:PLUGIN -eq 'true') { $params.Plugin = $true }
          ./benchmark/Invoke-TokenBenchmark.ps1 @params
          Get-ChildItem benchmark/results -Recurse -Filter summary.md | Get-Content -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: token-benchmark-${{ inputs.programme }}
          path: benchmark/results/
          retention-days: 30
