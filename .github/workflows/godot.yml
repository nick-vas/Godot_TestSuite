# Reusable Godot 4 pipeline that packs the PowerShell test suite (ci/godot/hyperdot.ps1) for a Linux
# runner: one test job (build once, run every detected test framework), then optional exports (one job per
# preset) and an optional GitHub Release. The same script runs locally on Windows. Works with no inputs:
#
#   jobs:
#     godot:
#       uses: nick-vas/hyperdot/.github/workflows/godot.yml@main
#
# Permissions come from the calling job: contents: read is enough to test; add pull-requests: write for
# the summary comment on pull requests, and contents: write for releases. See README.md.
name: Godot

on:
  workflow_call:
    inputs:
      project:
        description: Folder with project.godot (default - detected)
        type: string
        default: ""
      godot-version:
        description: "e.g. 4.7.2 or 4.8-rc1 (default - from Godot.NET.Sdk in the csproj, else 4.7.2)"
        type: string
        default: ""
      runners:
        description: "Comma list of runners (validate, architecture, dotnet, gdunit4, godottest, gut, flows, smoke, l10n, data, juice, playthrough, textsize, layout); none to only build (default - detected)"
        type: string
        default: ""
      filter:
        description: Test filter passed to each runner
        type: string
        default: ""
      retry:
        description: Run a failed test runner again up to this many times (0-5); tests that pass only on a retry are listed as flaky, never hidden
        type: number
        default: 0
      coverage:
        description: Collect coverage and add it to the job summary
        type: boolean
        default: false
      min-coverage:
        description: Fail when line coverage is below this percentage (0 = off; turns coverage on)
        type: number
        default: 0
      pr-comment:
        description: On pull requests, post one comment with the results (needs pull-requests - write)
        type: boolean
        default: true
      exports:
        description: 'Presets to export after tests pass: "all", a comma list of preset names, or empty for none'
        type: string
        default: ""
      run-exports:
        description: Launch each exported build on a runner of its own OS (Windows builds on windows-latest) and fail on errors
        type: boolean
        default: false
      release:
        description: Zip the exports and publish a GitHub Release when the run is for a tag (dry run otherwise; needs contents - write)
        type: boolean
        default: false
      runs-on:
        description: Runner label. Linux is cheapest; windows-latest also works
        type: string
        default: ubuntu-latest
      lfs:
        description: Check out Git LFS files
        type: boolean
        default: false
      submodules:
        description: "Check out submodules: false, true or recursive"
        type: string
        default: "false"
      retention-days:
        description: Days to keep test results and exports
        type: number
        default: 14
      timeout-minutes:
        description: Longest each job may run before it is cancelled (GitHub's own limit is 6 hours)
        type: number
        default: 60
      game-version:
        description: "Exports' version on runs that are not for a tag (tag runs use the tag): e.g. 1.2.3, or auto to read it from git's v* tags (the whole history is fetched)"
        type: string
        default: ""
      environment:
        description: "GitHub environment for the export jobs, e.g. one whose secrets and protection rules guard the signing keys (empty - none)"
        type: string
        default: ""
      kit-coverage:
        description: "Hyperdot's own self-test: records what the kit ran and uploads it as artifacts named <this>-test and <this>-export-<n> (empty - off)"
        type: string
        default: ""
    outputs:
      presets:
        description: JSON array of the presets that were exported
        value: ${{ jobs.test.outputs.presets }}
    # Signing material, all optional (pass them one by one or with secrets: inherit). Godot signs during the export when
    # they are set; files are written from base64 to the runner's temporary folder and deleted at the end of the job.
    secrets:
      GODOT_ANDROID_KEYSTORE_RELEASE_BASE64:
        description: "Android release keystore, base64 (becomes GODOT_ANDROID_KEYSTORE_RELEASE_PATH)"
        required: false
      GODOT_ANDROID_KEYSTORE_RELEASE_USER:
        description: Android release key alias
        required: false
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD:
        description: Android keystore password (Godot needs the key password to be the same)
        required: false
      GODOT_WINDOWS_CODESIGN_CERTIFICATE_BASE64:
        description: "Windows code signing certificate, PKCS#12 (.pfx), base64 (becomes GODOT_WINDOWS_CODESIGN_IDENTITY, type 1: a file)"
        required: false
      GODOT_WINDOWS_CODESIGN_PASSWORD:
        description: Password of the Windows certificate
        required: false
      GODOT_MACOS_CODESIGN_CERTIFICATE_BASE64:
        description: "macOS signing certificate, PKCS#12 (.p12), base64 (becomes GODOT_MACOS_CODESIGN_CERTIFICATE_FILE)"
        required: false
      GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD:
        description: Password of the macOS certificate
        required: false
      GODOT_MACOS_NOTARIZATION_API_KEY_BASE64:
        description: "App Store Connect API key (.p8), base64, for notarization (becomes GODOT_MACOS_NOTARIZATION_API_KEY)"
        required: false
      GODOT_MACOS_NOTARIZATION_API_KEY_ID:
        description: App Store Connect API key id
        required: false
      GODOT_MACOS_NOTARIZATION_API_UUID:
        description: App Store Connect issuer id
        required: false
  # The same inputs by hand (Actions > Godot > Run workflow), so the workflow has runs of its own: with no inputs it
  # tests the shallowest project here, examples/gdscript, as the self-test's zero-config job does.
  workflow_dispatch:
    inputs:
      project:
        description: Folder with project.godot (default - detected)
        type: string
        default: ""
      godot-version:
        description: "e.g. 4.7.2 or 4.8-rc1 (default - from Godot.NET.Sdk in the csproj, else 4.7.2)"
        type: string
        default: ""
      runners:
        description: "Comma list of runners (validate, architecture, dotnet, gdunit4, godottest, gut, flows, smoke, l10n, data, juice, playthrough, textsize, layout); none to only build (default - detected)"
        type: string
        default: ""
      filter:
        description: Test filter passed to each runner
        type: string
        default: ""
      retry:
        description: Run a failed test runner again up to this many times (0-5); tests that pass only on a retry are listed as flaky, never hidden
        type: number
        default: 0
      coverage:
        description: Collect coverage and add it to the job summary
        type: boolean
        default: false
      min-coverage:
        description: Fail when line coverage is below this percentage (0 = off; turns coverage on)
        type: number
        default: 0
      pr-comment:
        description: On pull requests, post one comment with the results (needs pull-requests - write)
        type: boolean
        default: true
      exports:
        description: 'Presets to export after tests pass: "all", a comma list of preset names, or empty for none'
        type: string
        default: ""
      run-exports:
        description: Launch each exported build on a runner of its own OS (Windows builds on windows-latest) and fail on errors
        type: boolean
        default: false
      release:
        description: Zip the exports and publish a GitHub Release when the run is for a tag (dry run otherwise; needs contents - write)
        type: boolean
        default: false
      runs-on:
        description: Runner label. Linux is cheapest; windows-latest also works
        type: string
        default: ubuntu-latest
      lfs:
        description: Check out Git LFS files
        type: boolean
        default: false
      submodules:
        description: "Check out submodules: false, true or recursive"
        type: string
        default: "false"
      retention-days:
        description: Days to keep test results and exports
        type: number
        default: 14
      timeout-minutes:
        description: Longest each job may run before it is cancelled (GitHub's own limit is 6 hours)
        type: number
        default: 60
      game-version:
        description: "Exports' version on runs that are not for a tag (tag runs use the tag): e.g. 1.2.3, or auto to read it from git's v* tags (the whole history is fetched)"
        type: string
        default: ""
      environment:
        description: "GitHub environment for the export jobs, e.g. one whose secrets and protection rules guard the signing keys (empty - none)"
        type: string
        default: ""

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      name: ${{ steps.godot.outputs.name }}
      presets: ${{ steps.exports.outputs.presets }}
      targets: ${{ steps.exports.outputs.targets }}
    steps:
      # LFS files are pulled by the action, which keeps them in the Actions cache.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      # This workflow's own repository at the exact commit the caller pinned, so the scripts always
      # match the workflow version without any extra input.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'nick-vas/hyperdot' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .godot-pipelines

      # Keep Godot from importing the pipeline repository's example projects.
      - run: New-Item -Force .godot-pipelines/.gdignore | Out-Null
        shell: pwsh

      # Only for Hyperdot's own self-test, whose coverage job counts what these jobs reach too.
      - name: Record the kit's coverage
        if: inputs.kit-coverage != ''
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'

      - id: godot
        uses: ./.godot-pipelines/.github/actions/godot
        with:
          command: test
          lfs: ${{ inputs.lfs }}
          project: ${{ inputs.project }}
          godot-version: ${{ inputs.godot-version }}
          runners: ${{ inputs.runners }}
          filter: ${{ inputs.filter }}
          retry: ${{ inputs.retry }}
          coverage: ${{ inputs.coverage }}
          min-coverage: ${{ inputs.min-coverage }}
          retention-days: ${{ inputs.retention-days }}

      - name: Comment on the pull request
        if: always() && inputs.pr-comment && github.event_name == 'pull_request' && steps.godot.outputs.name != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS: ${{ steps.godot.outputs.results }}
          NAME: ${{ steps.godot.outputs.name }}
          ARTIFACT: ${{ steps.godot.outputs.results-artifact }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.godot.outcome }}
        run: |
          ./.godot-pipelines/ci/godot/tools/Publish-PrComment.ps1 -ResultsDir "$env:RESULTS" -Name $env:NAME `
            -ArtifactName $env:ARTIFACT -PullRequest $env:PR -Outcome $env:OUTCOME

      - id: exports
        shell: pwsh
        env:
          WANTED: ${{ inputs.exports }}
          DETECTED: ${{ steps.godot.outputs.presets }}
          PLATFORMS: ${{ steps.godot.outputs.preset-platforms }}
          RUN_EXPORTS: ${{ inputs.run-exports }}
          DEFAULT_RUNNER: ${{ inputs.runs-on }}
        run: |
          $detected = @(if ($env:DETECTED) { $env:DETECTED | ConvertFrom-Json })
          $platforms = if ($env:PLATFORMS) { $env:PLATFORMS | ConvertFrom-Json -AsHashtable } else { @{} }
          $wanted = $env:WANTED.Trim()
          $presets = @(
            if ($wanted -eq 'all') { $detected }
            elseif ($wanted) { $wanted -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } }
          )
          $missing = @($presets | Where-Object { $_ -notin $detected })
          if ($missing) { Write-Host "::error::Unknown export presets $($missing -join ', '); the project has $($detected -join ', ')"; exit 1 }
          # To launch a build, export it on a runner of its own OS; otherwise use the default runner. iOS always goes to
          # macOS, where Xcode is.
          $targets = @($presets | ForEach-Object {
            $os = $env:DEFAULT_RUNNER
            if ($platforms[$_] -eq 'iOS') { $os = 'macos-latest' }
            elseif ($env:RUN_EXPORTS -eq 'true') {
              if ($platforms[$_] -eq 'Windows Desktop') { $os = 'windows-latest' }
              elseif ($platforms[$_] -match '^Linux') { $os = 'ubuntu-latest' }
            }
            @{ preset = $_; os = $os }
          })
          "presets=$(ConvertTo-Json -Compress -InputObject $presets)" >> $env:GITHUB_OUTPUT
          "targets=$(ConvertTo-Json -Compress -InputObject $targets)" >> $env:GITHUB_OUTPUT

      - name: Keep what the kit reached
        if: always() && inputs.kit-coverage != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.kit-coverage }}-test
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 1

  export:
    name: Export (${{ matrix.target.preset }})
    needs: test
    if: needs.test.outputs.targets != '[]'
    runs-on: ${{ matrix.target.os }}
    # Empty: no environment. Named: its protection rules apply, and its secrets of the names below are the ones used.
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.test.outputs.targets) }}
    steps:
      # game-version auto counts commits since the last tag, so it needs the whole history and the tags.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: ${{ inputs.game-version == 'auto' && '0' || '1' }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'nick-vas/hyperdot' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .godot-pipelines

      - run: New-Item -Force .godot-pipelines/.gdignore | Out-Null
        shell: pwsh

      # Signing files from the caller's secrets, when given: decoded into the runner's temporary folder, their paths
      # (never their contents) put in the environment under Godot's names, and deleted in the last step.
      - name: Signing files
        shell: pwsh
        env:
          ANDROID_KEYSTORE: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_BASE64 }}
          WINDOWS_CERTIFICATE: ${{ secrets.GODOT_WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE: ${{ secrets.GODOT_MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_API_KEY: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_KEY_BASE64 }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'godot-signing'
          $files = [ordered]@{
            ANDROID_KEYSTORE    = @('release.keystore', 'GODOT_ANDROID_KEYSTORE_RELEASE_PATH')
            WINDOWS_CERTIFICATE = @('windows.pfx', 'GODOT_WINDOWS_CODESIGN_IDENTITY')
            MACOS_CERTIFICATE   = @('macos.p12', 'GODOT_MACOS_CODESIGN_CERTIFICATE_FILE')
            MACOS_API_KEY       = @('notarization.p8', 'GODOT_MACOS_NOTARIZATION_API_KEY')
          }
          foreach ($name in $files.Keys) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value) { continue }
            $file = $files[$name][0]; $variable = $files[$name][1]
            New-Item -ItemType Directory -Force $dir | Out-Null
            $path = Join-Path $dir $file
            try { [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String(($value -replace '\s', ''))) }
            catch { Write-Host "::error::The secret for $variable is not valid base64"; exit 1 }
            "$variable=$path" >> $env:GITHUB_ENV
            # 1: the identity is a PKCS#12 file (0 would pick one automatically, 2 from the certificate store).
            if ($name -eq 'WINDOWS_CERTIFICATE') { 'GODOT_WINDOWS_CODESIGN_IDENTITY_TYPE=1' >> $env:GITHUB_ENV }
            Write-Host "$variable set"
          }

      - name: Record the kit's coverage
        if: inputs.kit-coverage != ''
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'

      - uses: ./.godot-pipelines/.github/actions/godot
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD }}
          GODOT_WINDOWS_CODESIGN_PASSWORD: ${{ secrets.GODOT_WINDOWS_CODESIGN_PASSWORD }}
          GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          GODOT_MACOS_NOTARIZATION_API_KEY_ID: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_KEY_ID }}
          GODOT_MACOS_NOTARIZATION_API_UUID: ${{ secrets.GODOT_MACOS_NOTARIZATION_API_UUID }}
        with:
          command: export
          lfs: ${{ inputs.lfs }}
          project: ${{ inputs.project }}
          godot-version: ${{ inputs.godot-version }}
          runners: none
          preset: ${{ matrix.target.preset }}
          run-exports: ${{ inputs.run-exports }}
          game-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.game-version }}
          retention-days: ${{ inputs.retention-days }}

      - name: Delete the signing files
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'godot-signing')

      # Numbered, not named after the preset: a preset name may hold characters an artifact name may not.
      - name: Keep what the kit reached
        if: always() && inputs.kit-coverage != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.kit-coverage }}-export-${{ strategy.job-index }}
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Release
    needs: [test, export]
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'nick-vas/hyperdot' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .godot-pipelines

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.test.outputs.name }}-*
          path: dist
          merge-multiple: true

      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.test.outputs.name }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./.godot-pipelines/ci/godot/tools/Publish-Release.ps1 -Dist dist -Name $env:NAME -Tag "$env:TAG"
