# Runs the kit's Claude Code plugin evals (evals/): every case with the plugin and without it, so a change to a skill,
# the verifier or the Stop hook shows whether it helps and what it costs. Manual only: each run calls the model.
# Authenticates with a Claude subscription, not an API key: run `claude setup-token` (Pro, Max, Team or Enterprise) and
# store the token as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Runs count against that plan's usage, which is meant
# for ordinary individual use: start it by hand, never on a schedule. docs/research.md has the local and other routes.
name: Evals

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case and arm
        default: '3'
      case:
        description: Case name glob (empty for all)
        default: ''

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # An ANTHROPIC_API_KEY in the environment would take precedence over the token, so none is set here.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The eval sandbox cannot read the home directory, so Godot is installed outside it.
      GODOT_TOOLS_DIR: /opt/hypedot
    steps:
      - uses: actions/checkout@v7
      - name: Eval sandbox, Claude Code and Godot
        shell: pwsh
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN) { throw 'Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (from claude setup-token) to run evals' }
          sudo apt-get update -q; sudo apt-get install -y -q bubblewrap socat
          # Ubuntu 23.10 and later stop unprivileged programs from making user namespaces (AppArmor), so bwrap fails with
          # "loopback: Failed RTM_NEWADDR: Operation not permitted" and every Bash call in a case fails with it: run 4
          # scored a sandbox that could not run a command. An AppArmor profile lets bwrap alone make them; the sysctl,
          # which lifts the restriction for every program, is the fallback on this throwaway runner.
          # Run 5 got past bwrap but every write in a case failed with "Read-only file system", the workspace included, so
          # the probe also needs a writable mount over the read-only root, as Claude Code's sandbox makes one.
          function Test-Sandbox {
            $probe = Join-Path $env:RUNNER_TEMP 'bwrap-probe'
            New-Item -ItemType Directory -Force $probe | Out-Null
            bwrap --ro-bind / / --bind $probe $probe --dev /dev --proc /proc --unshare-net --unshare-user touch (Join-Path $probe 'written') *> $null
            return $LASTEXITCODE -eq 0
          }
          if (-not (Test-Sandbox)) {
            "abi <abi/4.0>,`ninclude <tunables/global>`nprofile bwrap /usr/bin/bwrap flags=(unconfined) {`n  userns,`n}" | sudo tee /etc/apparmor.d/bwrap | Out-Null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          }
          if (-not (Test-Sandbox)) { sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 }
          if (-not (Test-Sandbox)) { throw 'bwrap cannot make a sandbox on this runner, so every Bash call in the evals would fail' }
          npm install -g @anthropic-ai/claude-code
          sudo mkdir -p $env:GODOT_TOOLS_DIR; sudo chown $env:USER $env:GODOT_TOOLS_DIR
          # Installs Godot and GUT into the example the cases copy, so runs need no download.
          ./ci/godot/hypedot.ps1 build -Project examples/gdscript
          $godot = Get-ChildItem $env:GODOT_TOOLS_DIR -Recurse -File -Filter 'Godot_v*_linux.x86_64' | Select-Object -First 1
          "EVAL_GODOT_BIN=$($godot.FullName)" >> $env:GITHUB_ENV
      # One small request first: a token that is malformed or revoked fails here, by name, instead of as a run of 0 scores.
      - name: The subscription token works
        shell: pwsh
        run: |
          $token = $env:CLAUDE_CODE_OAUTH_TOKEN
          if ($token -match '\s') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN contains spaces or line breaks; paste it again as one line' }
          if ($token -notmatch '^sk-ant-oat') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN does not start like a claude setup-token token (sk-ant-oat...)' }
          $out = claude -p 'Reply with the single word OK.' --max-turns 1 --output-format json 2>&1
          if ($LASTEXITCODE) { throw "Claude Code rejected CLAUDE_CODE_OAUTH_TOKEN; run claude setup-token again and replace the secret: $out" }
      - name: Run evals
        shell: pwsh
        env:
          RUNS: ${{ inputs.runs }}
          CASE: ${{ inputs.case }}
          # Run 6's transcripts: inside Claude Code's sandbox every run's workspace, home and TMPDIR under /tmp were
          # read-only (touch ./x failed), so Godot could not make its user folder and pwsh could not start. The runs'
          # folders go on the runner's own temp disk instead.
          TMPDIR: ${{ runner.temp }}
        run: |
          $caseArgs = if ($env:CASE) { @('--case', $env:CASE) } else { @() }
          New-Item -ItemType Directory -Force evals/results | Out-Null
          claude plugin eval . --runs $env:RUNS @caseArgs --scaffold --trust-plugin --allow-tools Bash Edit Write --no-publish --keep-temp --json evals/results/result.json
          $result = Get-Content evals/results/result.json -Raw | ConvertFrom-Json
          # Each run's transcript, uploaded with the result: the scores alone do not say why a command failed.
          New-Item -ItemType Directory -Force evals/results/traces | Out-Null
          foreach ($case in $result.cases) { foreach ($arm in $case.arms.PSObject.Properties) { $i = 0; foreach ($run in $arm.Value) { $i++; if ($run.tracePath -and (Test-Path -LiteralPath $run.tracePath)) { Copy-Item -LiteralPath $run.tracePath "evals/results/traces/$($case.name)-$($arm.Name)-$i.jsonl" } } } }
          $lines = @('| Case | With | Without | Delta |', '|---|---:|---:|---:|')
          foreach ($case in $result.cases) {
            $a = $case.aggregates
            $lines += '| {0} | {1:N2} | {2:N2} | {3:N2} |' -f $case.name, $a.score, $a.scoreWithout, $a.delta
          }
          $lines += '', ('Mean delta {0:N2}; total cost ${1:N2}' -f $result.aggregates.meanDelta, $result.costUsd)
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          # A low score is a result, not a failure; a run that never got graded (auth, rate limit, crash) is.
          $errors = @(foreach ($case in $result.cases) { foreach ($arm in $case.arms.PSObject.Properties) { foreach ($run in $arm.Value) { if ($run.error) { "$($case.name) ($($arm.Name)): $($run.error)" } } } })
          if ($result.partial -or $errors.Count) { throw "The evals did not finish: $($result.partialReason) $($errors -join '; ')" }
          # A run whose commands the sandbox refused graded the environment, not the plugin.
          if ((Get-Content evals/results/result.json -Raw) -match 'bwrap: |Read-only file system') { throw 'A case reports bwrap or read-only file system errors: the sandbox refused its commands, so these scores do not measure the plugin' }
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
