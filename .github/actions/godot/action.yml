name: Godot
description: Build, test or export a Godot 4 project (GDScript or C#) with ci/godot/hyperdot.ps1. Detects the project, Godot version and test frameworks; caches everything.
inputs:
  command:
    description: "test (default), build, or export"
    default: test
  project:
    description: Folder with project.godot (default - detected)
    default: ""
  godot-version:
    description: "e.g. 4.7.2 or 4.8-rc1 (default - from Godot.NET.Sdk in the csproj, else 4.7.2)"
    default: ""
  runners:
    description: "Comma list of runners (validate, architecture, dotnet, gdunit4, godottest, gut, flows, smoke, l10n, data, juice, playthrough, textsize, layout), or none (default - detected)"
    default: ""
  filter:
    description: Test filter passed to each runner
    default: ""
  retry:
    description: "Run a failed test runner again up to this many times (0-5); tests that pass only on a retry are listed as flaky, never hidden"
    default: "0"
  coverage:
    description: Collect coverage into the results artifact and job summary
    default: "false"
  min-coverage:
    description: Fail when line coverage is below this percentage (0 = off; implies coverage)
    default: "0"
  preset:
    description: "export: one preset name (default - every preset)"
    default: ""
  run-exports:
    description: "export: also launch the exported build when this runner's OS can run it, and fail on errors"
    default: "false"
  game-version:
    description: "export: the game's version, e.g. the tag v1.2.3 (its numbers become config/version for the export, all of it the C# InformationalVersion, and Android presets get version/code), or auto: from the nearest v* tag and the commits since (check out with fetch-depth: 0)"
    default: ""
  lfs:
    description: "Pull Git LFS files, keeping .git/lfs in the Actions cache (check out with lfs: false; the action pulls)"
    default: "false"
  retention-days:
    description: Days to keep uploaded artifacts
    default: "14"
outputs:
  version:
    description: "export with game-version: the version exported, e.g. 1.2.3-rc.1 or 1.2.3+4.gabc1234"
    value: ${{ steps.run.outputs.version }}
  android-version-code:
    description: "export with game-version: major*1,000,000 + minor*1,000 + patch, set as version/code of Android presets"
    value: ${{ steps.run.outputs.android-version-code }}
  build-path:
    description: "export: folder with the exports, one subfolder per preset"
    value: ${{ steps.run.outputs.build-path }}
  presets:
    description: JSON array of the project's export presets
    value: ${{ steps.detect.outputs.presets }}
  preset-platforms:
    description: JSON object mapping each preset to its platform
    value: ${{ steps.detect.outputs.preset-platforms }}
  name:
    description: The game's name from project.godot (used in artifact names)
    value: ${{ steps.detect.outputs.name }}
  results:
    description: Folder with test results, summary.json and summary.md
    value: ${{ steps.run.outputs.results }}
  results-artifact:
    description: Name of the uploaded test results artifact
    value: test-results-${{ steps.run.outputs.artifact }}
runs:
  using: composite
  steps:
    - id: detect
      shell: pwsh
      env:
        CLI: ${{ github.action_path }}/../../../ci/godot/hyperdot.ps1
        PROJECT: ${{ inputs.project }}
        GODOT_VERSION_INPUT: ${{ inputs.godot-version }}
      run: |
        $params = @{ GitHubOutput = $true }
        if ($env:PROJECT) { $params.Project = $env:PROJECT }
        if ($env:GODOT_VERSION_INPUT) { $params.GodotVersion = $env:GODOT_VERSION_INPUT }
        & $env:CLI detect @params
        $templates = if ($IsWindows) { Join-Path $env:APPDATA 'Godot/export_templates' }
          elseif ($IsMacOS) { Join-Path $HOME 'Library/Application Support/Godot/export_templates' }
          else { Join-Path $HOME '.local/share/godot/export_templates' }
        "templates=$templates" >> $env:GITHUB_OUTPUT

    # What the LFS and Gradle caches need: a hash of the LFS file list (empty when no file is in LFS), and whether an
    # exported preset is for Android (Godot's Gradle build downloads Gradle and its dependencies on every run).
    - id: extras
      if: inputs.lfs == 'true' || inputs.command == 'export'
      shell: pwsh
      env:
        LFS: ${{ inputs.lfs }}
        COMMAND: ${{ inputs.command }}
        PRESET: ${{ inputs.preset }}
        PLATFORMS: ${{ steps.detect.outputs.preset-platforms }}
      run: |
        if ($env:LFS -eq 'true') {
          $files = @(git lfs ls-files -l)
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::lfs is true, but git lfs ls-files failed: is Git LFS installed on this runner?'; exit 1 }
          if ($files.Count -gt 0) {
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($files -join "`n")))
            "lfs-hash=$hash" >> $env:GITHUB_OUTPUT
          }
        }
        if ($env:COMMAND -eq 'export') {
          $platforms = if ($env:PLATFORMS) { $env:PLATFORMS | ConvertFrom-Json -AsHashtable } else { @{} }
          $wanted = @(if ($env:PRESET) { $env:PRESET -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } } else { $platforms.Keys })
          $android = @($wanted | Where-Object { $platforms[$_] -eq 'Android' }).Count -gt 0
          "android=$($android.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        }

    # Git LFS objects: restored into .git/lfs, then only the missing ones are downloaded (LFS bandwidth is billed).
    - id: lfs-cache
      if: steps.extras.outputs.lfs-hash != ''
      uses: actions/cache/restore@v6
      with:
        path: .git/lfs
        key: git-lfs-${{ runner.os }}-${{ steps.extras.outputs.lfs-hash }}
        restore-keys: git-lfs-${{ runner.os }}-

    - id: lfs-pull
      if: steps.extras.outputs.lfs-hash != ''
      shell: pwsh
      run: |
        git lfs pull
        exit $LASTEXITCODE

    # Only C# projects use the .NET build of Godot; GDScript projects get the standard build.
    - if: steps.detect.outputs.csharp == 'true'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    # Restored here, saved at the end even when the tests fail (actions/cache saves only after a green job, so a red
    # branch would download Godot and its templates again on every run). The flavour is in each key: C# projects use
    # the .NET build and its templates, GDScript projects the standard ones, and a repository with both would otherwise
    # restore the wrong one under a key that already exists, and never save the right one.
    - id: godot-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.hyperdot
        key: hyperdot-${{ runner.os }}-${{ runner.arch }}-${{ steps.detect.outputs.godot-version }}-${{ steps.detect.outputs.csharp == 'true' && 'mono' || 'standard' }}

    - id: templates-cache
      if: inputs.command == 'export'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.detect.outputs.templates }}
        key: godot-templates-${{ runner.os }}-${{ steps.detect.outputs.godot-version }}-${{ steps.detect.outputs.csharp == 'true' && 'mono' || 'standard' }}

    # Android's Gradle build (gradle_build/use_gradle_build) downloads Gradle and its dependencies into ~/.gradle; the key
    # follows the build template Godot installed into the project (android/build).
    - id: gradle-cache
      if: steps.extras.outputs.android == 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ steps.detect.outputs.godot-version }}-${{ hashFiles('**/android/build/*.gradle', '**/android/build/gradle/wrapper/gradle-wrapper.properties', '**/android/build/gradle.properties') }}
        restore-keys: gradle-${{ runner.os }}-${{ steps.detect.outputs.godot-version }}-

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
        restore-keys: nuget-${{ runner.os }}-

    # Godot's import cache: reused safely after a checkout to a new path with new file times (tested on 4.7.2, zero
    # reimports). Not .godot/mono, which holds build output. The key hashes the source assets too: a .import file does
    # not change when the picture it describes does, so a key of .import files alone never moves, and the cache would
    # be restored stale and reimported on every run without ever being saved again.
    - id: import-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.detect.outputs.project }}/.godot/imported
          ${{ steps.detect.outputs.project }}/.godot/uid_cache.bin
          ${{ steps.detect.outputs.project }}/.godot/editor/filesystem_cache*
        key: godot-import-${{ runner.os }}-${{ steps.detect.outputs.godot-version }}-${{ hashFiles('**/*.import', '**/project.godot', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp', '**/*.svg', '**/*.tga', '**/*.exr', '**/*.hdr', '**/*.glb', '**/*.gltf', '**/*.blend', '**/*.fbx', '**/*.obj', '**/*.dae', '**/*.wav', '**/*.ogg', '**/*.mp3', '**/*.ttf', '**/*.otf', '**/*.woff2', '**/*.csv') }}
        restore-keys: godot-import-${{ runner.os }}-${{ steps.detect.outputs.godot-version }}-

    - id: run
      shell: pwsh
      env:
        CLI: ${{ github.action_path }}/../../../ci/godot/hyperdot.ps1
        COMMAND: ${{ inputs.command }}
        PROJECT: ${{ steps.detect.outputs.project }}
        NAME: ${{ steps.detect.outputs.name }}
        GODOT_VERSION_INPUT: ${{ steps.detect.outputs.godot-version }}
        RUNNERS: ${{ inputs.runners }}
        FILTER: ${{ inputs.filter }}
        RETRY: ${{ inputs.retry }}
        COVERAGE: ${{ inputs.coverage }}
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        PRESET: ${{ inputs.preset }}
        RUN_EXPORTS: ${{ inputs.run-exports }}
        GAME_VERSION: ${{ inputs.game-version }}
      run: |
        $results = Join-Path $env:RUNNER_TEMP 'godot-test-results'
        $output = Join-Path $env:RUNNER_TEMP 'godot-build'
        # Unique per OS and project, so matrix and monorepo callers don't collide; runners picked by hand are named too,
        # so two jobs that test one project with different runners do not upload the same artifact name (which fails).
        $preset = if ($env:PRESET) { $env:PRESET } else { 'all' }
        $picked = if ($env:RUNNERS) { '-' + ($env:RUNNERS -replace '[^A-Za-z0-9._-]+', '-').Trim('-') } else { '' }
        @(
          "results=$results"
          "output=$output"
          "artifact=$env:NAME-$env:RUNNER_OS$picked"
          "export-artifact=$env:NAME-$(($preset -replace '[^A-Za-z0-9._-]+', '-').Trim('-'))"
        ) >> $env:GITHUB_OUTPUT
        if ($env:COMMAND -eq 'export') { "build-path=$output" >> $env:GITHUB_OUTPUT }

        $params = @{ Project = $env:PROJECT; GodotVersion = $env:GODOT_VERSION_INPUT; Results = $results; Output = $output }
        if ($env:RUNNERS) { $params.Runners = $env:RUNNERS }
        if ($env:FILTER) { $params.Filter = $env:FILTER }
        if ($env:COMMAND -eq 'test' -and [int]$env:RETRY -gt 0) { $params.Retry = [int]$env:RETRY }
        if ($env:COVERAGE -eq 'true') { $params.Coverage = $true }
        if ($env:PRESET) { $params.Preset = $env:PRESET }
        if ([double]$env:MIN_COVERAGE -gt 0) { $params.MinCoverage = [double]$env:MIN_COVERAGE }
        if ($env:RUN_EXPORTS -eq 'true') { $params.Run = $true }
        if ($env:GAME_VERSION) { $params.GameVersion = $env:GAME_VERSION }
        # export writes version and android-version-code to this step's outputs.
        if ($env:COMMAND -eq 'export') { $params.GitHubOutput = $true }
        & $env:CLI $env:COMMAND @params
        $code = $LASTEXITCODE
        # Only an export that used Gradle has anything there to save.
        if (Test-Path -LiteralPath (Join-Path $HOME '.gradle/caches')) { 'gradle=true' >> $env:GITHUB_OUTPUT }
        exit $code

    # Only a complete install (Setup writes HYPERDOT_INSTALLED after it), never a half-finished download.
    - if: always() && steps.godot-cache.outputs.cache-hit != 'true' && env.HYPERDOT_INSTALLED == '1'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ~/.hyperdot
        key: ${{ steps.godot-cache.outputs.cache-primary-key }}

    - if: always() && inputs.command == 'export' && steps.templates-cache.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ steps.detect.outputs.templates }}
        key: ${{ steps.templates-cache.outputs.cache-primary-key }}

    - if: always() && steps.lfs-pull.outcome == 'success' && steps.lfs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: .git/lfs
        key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

    - if: always() && steps.extras.outputs.android == 'true' && steps.run.outputs.gradle == 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

    - if: always() && steps.import-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: |
          ${{ steps.detect.outputs.project }}/.godot/imported
          ${{ steps.detect.outputs.project }}/.godot/uid_cache.bin
          ${{ steps.detect.outputs.project }}/.godot/editor/filesystem_cache*
        key: ${{ steps.import-cache.outputs.cache-primary-key }}

    - if: always() && inputs.command == 'test' && steps.run.outputs.results != ''
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ steps.run.outputs.artifact }}
        path: ${{ steps.run.outputs.results }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    - if: inputs.command == 'export'
      uses: actions/upload-artifact@v7
      with:
        # One artifact per call: export a single preset per job to get one download per platform.
        name: ${{ steps.run.outputs.export-artifact }}
        path: ${{ steps.run.outputs.output }}
        retention-days: ${{ inputs.retention-days }}
